workflows:
  ios-testflight:
    name: iOS TestFlight (UPCAT Reviewer 2027)
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - Secure
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.niotron.domingotambasacan.upcataireviewer2027
      vars:
        BUNDLE_ID: "com.niotron.domingotambasacan.upcataireviewer2027"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Validate uploaded signing assets
        script: |
          echo "Using uploaded certificates/profiles from Codemagic Code Signing Identity store"

      - name: Apply iOS signing settings
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Resolve Flutter build version
        script: |
          FLUTTER_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          FLUTTER_BUILD_NAME="${FLUTTER_VERSION%%+*}"
          echo "Resolved Flutter build name: ${FLUTTER_BUILD_NAME}"
          echo "FLUTTER_BUILD_NAME=${FLUTTER_BUILD_NAME}" >> "$CM_ENV"

      - name: Build IPA for TestFlight
        script: |
          if [ -z "$GPT_API_KEY" ] || [ -z "$GEMINI_API_KEY" ] || [ -z "$DEEPSEEK_API_KEY" ] || [ -z "$REPORT_CONTENT_WEBHOOK_URL" ]; then
            echo "Missing one or more required environment values in group 'Secure'."
            echo "Make sure GPT_API_KEY, GEMINI_API_KEY, DEEPSEEK_API_KEY, and REPORT_CONTENT_WEBHOOK_URL exist in Codemagic and this workflow imports that group."
            exit 1
          fi

          flutter build ipa --release \
            --build-name="$FLUTTER_BUILD_NAME" \
            --build-number="${PROJECT_BUILD_NUMBER:-1}" \
            --dart-define=GPT_API_KEY="${GPT_API_KEY}" \
            --dart-define=GEMINI_API_KEY="${GEMINI_API_KEY}" \
            --dart-define=DEEPSEEK_API_KEY="${DEEPSEEK_API_KEY}" \
            --dart-define=REPORT_CONTENT_WEBHOOK_URL="${REPORT_CONTENT_WEBHOOK_URL}" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - domingotambasacan@gmail.com
        notify:
          success: true
          failure: true
