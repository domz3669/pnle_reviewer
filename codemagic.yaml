workflows:
  ios-testflight:
    name: iOS TestFlight (PNLE Reviewer 2027)
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - Secure
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.niotron.domingotambasacan.pnleaireviewer2026
      vars:
        BUNDLE_ID: "com.niotron.domingotambasacan.pnleaireviewer2026"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize

      - name: Validate uploaded signing assets
        script: |
          echo "Using uploaded certificates/profiles from Codemagic Code Signing Identity store"

      - name: Apply iOS signing settings
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Print iOS signing diagnostics
        script: |
          echo "Codemagic workflow bundle ID: $BUNDLE_ID"
          echo "Provisioning profiles on disk:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true
          echo "Certificates on disk:"
          ls -la ~/Library/MobileDevice/Certificates || true
          echo "Effective Xcode PRODUCT_BUNDLE_IDENTIFIER:"
          xcodebuild -workspace ios/$XCODE_WORKSPACE -scheme $XCODE_SCHEME -showBuildSettings | grep PRODUCT_BUNDLE_IDENTIFIER || true

      - name: Regenerate Flutter iOS generated files
        script: |
          rm -f ios/Flutter/Generated.xcconfig ios/Flutter/flutter_export_environment.sh

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Add WidgetKit extension target
        script: |
          gem install xcodeproj
          ruby scripts/add_widget_extension.rb

      - name: Re-apply signing after widget target added
        script: |
          xcode-project use-profiles

      - name: Print regenerated Flutter iOS config
        script: |
          echo "Regenerated ios/Flutter/Generated.xcconfig:"
          sed -n '1,12p' ios/Flutter/Generated.xcconfig || true

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Resolve Flutter build version
        script: |
          FLUTTER_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          FLUTTER_BUILD_NAME="${FLUTTER_VERSION%%+*}"
          FLUTTER_BUILD_NUMBER="${FLUTTER_VERSION##*+}"
          echo "Resolved Flutter build name: ${FLUTTER_BUILD_NAME}"
          echo "Resolved Flutter build number: ${FLUTTER_BUILD_NUMBER}"
          echo "FLUTTER_BUILD_NAME=${FLUTTER_BUILD_NAME}" >> "$CM_ENV"
          echo "FLUTTER_BUILD_NUMBER=${FLUTTER_BUILD_NUMBER}" >> "$CM_ENV"

      - name: Build IPA for TestFlight
        script: |
          if [ -z "$QUESTIONS_GATEWAY_URL" ] || [ -z "$EXPLANATION_GATEWAY_URL" ] || [ -z "$REPORT_CONTENT_WEBHOOK_URL" ]; then
            echo "Missing one or more required environment values in group 'Secure'."
            echo "Make sure QUESTIONS_GATEWAY_URL, EXPLANATION_GATEWAY_URL, and REPORT_CONTENT_WEBHOOK_URL exist in Codemagic and this workflow imports that group."
            exit 1
          fi

          flutter build ipa --release \
            --build-name="$FLUTTER_BUILD_NAME" \
            --build-number="$FLUTTER_BUILD_NUMBER" \
            --dart-define=QUESTIONS_GATEWAY_URL="${QUESTIONS_GATEWAY_URL}" \
            --dart-define=EXPLANATION_GATEWAY_URL="${EXPLANATION_GATEWAY_URL}" \
            --dart-define=REPORT_CONTENT_WEBHOOK_URL="${REPORT_CONTENT_WEBHOOK_URL}" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - domingotambasacan@gmail.com
        notify:
          success: true
          failure: true
